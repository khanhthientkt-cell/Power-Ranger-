name: Deploy Count Quest to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the branch below.
# One-time setup: Repo Settings → Pages → "Build and deployment" → Source = GitHub Actions.

on:
  push:
    branches:
      - claude/eloquent-ride-qffhji
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The game lives at the repo root (index.html, styles.css, app.js)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
